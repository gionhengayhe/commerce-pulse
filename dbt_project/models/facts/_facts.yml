version: 2

models:
  - name: fct_events
    description: One clickstream event with session context and an order key populated only for purchase events.
    columns:
      - name: event_id
        data_tests: [not_null, unique]
      - name: session_id
        data_tests: [not_null]
      - name: event_date
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day
  - name: fct_order_lines
    description: One retained raw order line with allocated revenue and estimated profitability.
    columns:
      - name: order_line_key
        data_tests: [not_null, unique]
      - name: order_id
        data_tests: [not_null]
      - name: product_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_product')
                field: product_id
      - name: order_date
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day
  - name: fct_orders
    description: One observed purchase order with acquisition context, customer sequence, and reconciled economics.
    columns:
      - name: order_id
        data_tests: [not_null, unique]
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customer')
                field: customer_id
      - name: matched_session_id
        data_tests: [not_null, unique]
      - name: order_date
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day
  - name: fct_sessions
    description: One browsing session; the canonical fact for session funnel analysis.
    columns:
      - name: session_id
        data_tests: [not_null, unique]
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customer')
                field: customer_id
      - name: session_date
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day
  - name: fct_reviews
    description: One submitted product review linked to the reviewed order and customer; source review timestamps are not guaranteed to follow order timestamps.
    columns:
      - name: review_id
        data_tests: [not_null, unique]
      - name: order_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_orders')
                field: order_id
      - name: product_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_product')
                field: product_id
      - name: review_date
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day
      - name: days_after_order
        description: Signed day difference from order to review; negative values expose source timestamp inconsistencies.
      - name: is_review_on_or_after_order
        data_tests: [not_null]
