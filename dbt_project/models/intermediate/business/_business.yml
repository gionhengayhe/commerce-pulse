version: 2

models:
  - name: int_product_session
    description: One session-product pair combining behavioral events with purchases from the order matched to that session.
    columns:
      - name: session_id
        data_tests: [not_null]
      - name: product_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_product')
                field: product_id
  - name: int_category_session
    description: One session-category pair, preventing distinct session counts from being double-counted across products in the same category.
    columns:
      - name: session_id
        data_tests: [not_null]
      - name: category
        data_tests: [not_null]
  - name: int_customer_cohort_months
    description: One purchasing customer per observable cohort age month, ending at the latest observed order month. Future right-censored periods are not materialized.
    columns:
      - name: customer_id
        data_tests: [not_null]
      - name: months_since_first_order
        data_tests: [not_null]
      - name: activity_month
        data_tests: [not_null]
      - name: is_eligible
        description: Always true because future right-censored periods are excluded before materialization; retained as an explicit downstream metric contract.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true]
                quote: false
