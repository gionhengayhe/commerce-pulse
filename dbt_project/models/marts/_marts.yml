version: 2

models:
  - name: mart_executive_daily
    description: One calendar day with additive traffic, funnel, customer, order, revenue, and profitability measures.
    columns:
      - name: date_day
        data_tests: [not_null, unique]
  - name: mart_channel_funnel_daily
    description: One session day-source-device-country combination; orders and revenue are attributed to the matched acquisition session.
    columns:
      - name: date_day
        data_tests: [not_null]
      - name: session_source
        data_tests: [not_null]
      - name: session_device
        data_tests: [not_null]
      - name: session_country
        data_tests: [not_null]
  - name: mart_customer_lifecycle
    description: One customer with acquisition, signed lifecycle timing, eligibility-aware retention flags, RFM components, and lifetime economics.
    columns:
      - name: customer_id
        data_tests: [not_null, unique]
      - name: as_of_date
        data_tests: [not_null]
      - name: days_signup_to_first_order
        description: Signed day difference; negative values expose source records where an order predates signup.
      - name: is_first_order_on_or_after_signup
        data_tests: [not_null]
  - name: mart_cohort_retention_monthly
    description: One first-purchase cohort and cohort-age month with explicit eligible and active customer denominators.
    columns:
      - name: first_order_cohort_month
        data_tests: [not_null]
      - name: months_since_first_order
        data_tests: [not_null]
      - name: activity_month
        data_tests: [not_null]
  - name: mart_product_performance_monthly
    description: One calendar month-product; behavioral metrics use session month, sales use order month, and reviews use review month.
    columns:
      - name: calendar_month
        data_tests: [not_null]
      - name: product_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_product')
                field: product_id
  - name: mart_category_performance_monthly
    description: One calendar month-category calculated directly from session-category grain to preserve distinct session semantics.
    columns:
      - name: calendar_month
        data_tests: [not_null]
      - name: category
        data_tests: [not_null]
